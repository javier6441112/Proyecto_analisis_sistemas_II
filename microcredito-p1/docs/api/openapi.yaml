openapi: 3.1.0
info:
  title: SGMC - API de Crédito Vecino, S. A.
  version: 2.0.0
  description: >-
    API REST del Sistema de Gestión de Microcrédito. Contrato generado desde los
    esquemas Zod de

    `src/contratos/api.ts`, que también valida el servidor: el contrato y la
    validación comparten una única fuente de verdad.


    - Toda lectura exige `fechaCorte` explícita; la API nunca lee el reloj.

    - El dinero viaja como texto (`{ valor: "1004.62", moneda: "GTQ" }`), nunca
    como número.

    - Las operaciones exigen las cabeceras `X-Perfil` (asesor | gerencia) y
    `X-Usuario`.

    - Registrar un pago exige `Idempotency-Key` y aprobación humana explícita.
servers:
  - url: http://127.0.0.1:3000
    description: Servidor local (npm run api)
tags:
  - name: Catálogos
    description: Asesores, políticas y clientes
  - name: Créditos
    description: Consulta de créditos, planes y mora
  - name: Originación
    description: Solicitudes, comité y desembolso
  - name: Cobros
    description: Simulación y registro de pagos
  - name: Gerencia
    description: Cartera, vencimientos y cierres
  - name: Asistente
    description: Chat gerencial y aprobación de propuestas
paths:
  /api/salud:
    get:
      tags:
        - Catálogos
      operationId: salud
      summary: Estado del servicio y auditoría de pagos
      responses:
        "200":
          description: Servicio disponible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    const: ok
                  pagos: {}
                required:
                  - estado
  /api/asesores:
    get:
      tags:
        - Catálogos
      operationId: listarAsesores
      summary: Lista los asesores de crédito
      responses:
        "200":
          description: Asesores.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asesor"
              example:
                - idAsesor: AS-01
                  nombreCompleto: Byron Estuardo Cifuentes
  /api/politicas:
    get:
      tags:
        - Catálogos
      operationId: consultarPoliticas
      summary: Parámetros de política de mora vigentes
      responses:
        "200":
          description: Parámetros de política.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Politicas"
  /api/clientes:
    get:
      tags:
        - Catálogos
      operationId: buscarClientes
      summary: Busca clientes por código, nombre o DPI
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Clientes que coinciden.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cliente"
    post:
      tags:
        - Catálogos
      operationId: registrarCliente
      summary: Registra un cliente
      parameters: &a4
        - &a5
          name: X-Perfil
          in: header
          required: true
          schema:
            type: string
            enum:
              - asesor
              - gerencia
          description: Perfil de quien opera
        - &a6
          name: X-Usuario
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Nombre de quien opera (auditoría)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AltaClienteBody"
            example:
              idCliente: CL-0101
              nombreCompleto: Ana López Pérez
              dpi: "2598112340101"
              telefono: 5555-4787
              municipio: Cobán
              fechaAlta: 2026-10-31
      responses:
        "201":
          description: Cliente registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "400": &a1
          description: Datos inválidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              example:
                type: https://creditovecino.local/problemas/datos-invalidos
                title: Datos inválidos
                status: 400
                detail: La solicitud no cumple el esquema
                codigo: DATOS_INVALIDOS
        "409":
          description: Registro duplicado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              example:
                type: https://creditovecino.local/problemas/entidad-duplicada
                title: Registro duplicado
                status: 409
                detail: Ya existe un cliente con ese código o DPI
                codigo: ENTIDAD_DUPLICADA
  /api/creditos:
    get:
      tags:
        - Créditos
      operationId: listarCreditos
      summary: Lista los créditos a una fecha de corte
      parameters:
        - name: fechaCorte
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Fecha calendario AAAA-MM-DD
            examples:
              - 2026-10-31
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: idAsesor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Créditos con saldo, estado y próxima cuota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListadoCreditos"
        "400": *a1
  /api/creditos/{idCredito}:
    get:
      tags:
        - Créditos
      operationId: consultarCredito
      summary: Detalle de un crédito a una fecha de corte
      parameters:
        - &a2
          name: idCredito
          in: path
          required: true
          description: Identificador del crédito (CV-AAAA-NNNN)
          schema:
            type: string
        - name: fechaCorte
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Fecha calendario AAAA-MM-DD
            examples:
              - 2026-10-31
      responses:
        "200":
          description: Detalle con cuotas vencidas, pendientes y pagos aplicados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetalleCredito"
        "400": *a1
        "404":
          description: Crédito inexistente
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              example:
                type: https://creditovecino.local/problemas/credito-inexistente
                title: Crédito inexistente
                status: 404
                detail: No existe el crédito CV-2026-9999
                codigo: CREDITO_INEXISTENTE
  /api/creditos/{idCredito}/plan:
    get:
      tags:
        - Créditos
      operationId: consultarPlanCredito
      summary: Plan de amortización con el estado de cada cuota
      parameters:
        - *a2
        - name: fechaCorte
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Fecha calendario AAAA-MM-DD
            examples:
              - 2026-10-31
      responses:
        "200":
          description: Plan del crédito.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanCredito"
        "400": *a1
        "404": &a3
          description: Registro inexistente
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              example:
                type: https://creditovecino.local/problemas/entidad-inexistente
                title: Registro inexistente
                status: 404
                detail: No existe el registro solicitado
                codigo: ENTIDAD_INEXISTENTE
  /api/creditos/{idCredito}/cuotas/{numero}/mora:
    get:
      tags:
        - Créditos
      operationId: explicarMora
      summary: Desglose del interés moratorio de una cuota por tramo recorrido
      parameters:
        - *a2
        - name: numero
          in: path
          required: true
          description: Número de cuota
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
        - name: fechaCorte
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Fecha calendario AAAA-MM-DD
            examples:
              - 2026-10-31
      responses:
        "200":
          description: Tramos recorridos y total redondeado una sola vez.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplicacionMora"
        "400": *a1
        "404": *a3
        "409":
          description: Cuota no vencida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              example:
                type: https://creditovecino.local/problemas/cuota-no-vencida
                title: Cuota no vencida
                status: 409
                detail: La cuota aún no está vencida a la fecha de corte
                codigo: CUOTA_NO_VENCIDA
  /api/simulaciones/plan:
    post:
      tags:
        - Originación
      operationId: simularPlan
      summary: Simula un plan de amortización (sistema francés)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanBody"
            example:
              capital: "10000.00"
              plazoMeses: 12
              tnaBps: 3600
              fechaDesembolso: 2026-10-31
      responses:
        "200":
          description: Plan simulado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanSimulado"
        "400": *a1
  /api/solicitudes:
    get:
      tags:
        - Originación
      operationId: listarSolicitudes
      summary: Bandeja de solicitudes de crédito
      responses:
        "200":
          description: Solicitudes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Solicitud"
    post:
      tags:
        - Originación
      operationId: crearSolicitud
      summary: Registra una solicitud de crédito y devuelve su plan
      parameters: *a4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudBody"
            example:
              idCliente: CL-0001
              idAsesor: AS-01
              capital: "10000.00"
              plazoMeses: 12
              tnaBps: 3600
              fecha: 2026-10-31
      responses:
        "201":
          description: Solicitud registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudCreada"
        "400": *a1
        "404": *a3
        "409": &a7
          description: Conflicto de estado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              example:
                type: https://creditovecino.local/problemas/transicion-invalida
                title: Conflicto de estado
                status: 409
                detail: La operación no es válida en el estado actual
                codigo: TRANSICION_INVALIDA
  /api/solicitudes/{idSolicitud}/resolucion:
    post:
      tags:
        - Originación
      operationId: resolverSolicitud
      summary: Aprueba o rechaza una solicitud (solo gerencia)
      parameters:
        - &a8
          name: idSolicitud
          in: path
          required: true
          description: Identificador de la solicitud (SOL-NNNN)
          schema:
            type: string
        - *a5
        - *a6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolucionBody"
            example:
              decision: APROBADA
              motivo: Cumple la política de crédito
              fecha: 2026-10-31
      responses:
        "200":
          description: Solicitud resuelta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitud"
        "400": *a1
        "403":
          description: No autorizado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              example:
                type: https://creditovecino.local/problemas/no-autorizado
                title: No autorizado
                status: 403
                detail: Solo el perfil gerencia puede resolver solicitudes
                codigo: NO_AUTORIZADO
        "404": *a3
        "409": *a7
  /api/solicitudes/{idSolicitud}/desembolso:
    post:
      tags:
        - Originación
      operationId: desembolsar
      summary: Desembolsa una solicitud aprobada y crea el crédito
      parameters:
        - *a8
        - *a5
        - *a6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesembolsoBody"
            example:
              idCredito: CV-2026-0076
              fecha: 2026-10-31
      responses:
        "201":
          description: Crédito creado con su plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetalleCredito"
        "400": *a1
        "404": *a3
        "409": *a7
  /api/pagos/simulacion:
    post:
      tags:
        - Cobros
      operationId: simularPago
      summary: Consulta lo exigible o simula la liquidación de un pago
      description: Sin `monto` devuelve el crédito y la cuota exigible. Con `monto`
        devuelve ACEPTABLE, DUPLICADO o RECHAZADO sin escribir nada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulacionPagoBody"
            example:
              idCredito: CV-2026-0043
              fechaPago: 2026-10-31
      responses:
        "200":
          description: Resultado de la simulación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulacionPago"
        "400": *a1
        "404": *a3
  /api/creditos/{idCredito}/pagos:
    post:
      tags:
        - Cobros
      operationId: registrarPago
      summary: Registra un pago sobre la cuota vencida más antigua
      description: Aplica gastos, interés moratorio, interés corriente y capital, en
        ese orden. El monto debe saldar exactamente la cuota exigible.
      parameters:
        - *a2
        - *a5
        - *a6
        - name: Idempotency-Key
          in: header
          required: true
          description: Si se repite, devuelve el pago original sin cobrar de nuevo.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagoBody"
            example:
              monto: "1114.54"
              fechaPago: 2026-10-31
              canal: agencia
              aprobacion:
                aprobado: true
                aprobadoPor: Elena Morales
      responses:
        "200":
          description: Pago ya registrado con esa clave; no se cobra de nuevo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoDuplicadoRespuesta"
        "201":
          description: Pago aplicado por primera vez.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoAplicadoRespuesta"
        "400": *a1
        "404":
          description: Crédito inexistente
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              example:
                type: https://creditovecino.local/problemas/credito-inexistente
                title: Crédito inexistente
                status: 404
                detail: No existe el crédito CV-2026-9999
                codigo: CREDITO_INEXISTENTE
        "409":
          description: Clave de idempotencia en conflicto
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              example:
                type: https://creditovecino.local/problemas/clave-en-conflicto
                title: Clave de idempotencia en conflicto
                status: 409
                detail: La clave ya se usó con otro contenido
                codigo: CLAVE_EN_CONFLICTO
        "422":
          description: Monto no exacto
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              example:
                type: https://creditovecino.local/problemas/monto-no-exacto
                title: Monto no exacto
                status: 422
                detail: "El pago debe saldar exactamente la cuota 4: Q301.46 (recibido Q500.00)"
                codigo: MONTO_NO_EXACTO
        "428":
          description: Aprobación humana requerida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
              example:
                type: https://creditovecino.local/problemas/aprobacion-requerida
                title: Aprobación humana requerida
                status: 428
                detail: Registrar un pago exige la aprobación explícita de una persona.
                codigo: APROBACION_REQUERIDA
  /api/cartera:
    get:
      tags:
        - Gerencia
      operationId: consultarCartera
      summary: "Tablero: cartera activa, en mora y en riesgo"
      parameters:
        - name: fechaCorte
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Fecha calendario AAAA-MM-DD
            examples:
              - 2026-10-31
      responses:
        "200":
          description: Cartera consolidada con porcentajes formateados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarteraTablero"
        "400": *a1
  /api/cartera/mora:
    get:
      tags:
        - Gerencia
      operationId: listarCreditosEnMora
      summary: Créditos en mora, opcionalmente de un tramo
      parameters:
        - name: fechaCorte
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Fecha calendario AAAA-MM-DD
            examples:
              - 2026-10-31
        - name: tramo
          in: query
          required: false
          schema:
            type: string
            enum:
              - MORA_1
              - MORA_2
              - MORA_3
              - VENCIDO
              - INCOBRABLE
      responses:
        "200":
          description: Créditos del tramo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListadoMora"
        "400": *a1
  /api/vencimientos:
    get:
      tags:
        - Gerencia
      operationId: verProximosVencimientos
      summary: Cuotas que vencen en los próximos días
      parameters:
        - name: fechaCorte
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Fecha calendario AAAA-MM-DD
            examples:
              - 2026-10-31
        - name: dias
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 366
      responses:
        "200":
          description: Próximos vencimientos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vencimientos"
        "400": *a1
  /api/cierres/{periodo}:
    get:
      tags:
        - Gerencia
      operationId: consultarCierre
      summary: Cierre diario (AAAA-MM-DD) o mensual (AAAA-MM)
      description: "Idempotente: consultar el mismo periodo devuelve siempre las
        mismas cifras y no genera movimientos."
      parameters:
        - name: periodo
          in: path
          required: true
          description: AAAA-MM o AAAA-MM-DD
          schema:
            type: string
            pattern: ^\d{4}-\d{2}(-\d{2})?$
      responses:
        "200":
          description: Cierre del periodo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cierre"
        "400": *a1
  /api/chat:
    post:
      tags:
        - Asistente
      operationId: preguntarAsistente
      summary: Pregunta al asistente gerencial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreguntaChatBody"
            example:
              mensaje: ¿Cuál es la cartera en riesgo?
              fechaOperacion: 2026-10-31
      responses:
        "200":
          description: Respuesta con tarjetas de datos del núcleo y citas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaChat"
        "400": *a1
  /api/chat/{sesionId}:
    delete:
      tags:
        - Asistente
      operationId: olvidarSesion
      summary: Olvida el historial de una sesión de chat
      parameters:
        - name: sesionId
          in: path
          required: true
          description: Identificador de la sesión
          schema:
            type: string
      responses:
        "204":
          description: Sesión olvidada.
  /api/propuestas/{id}:
    get:
      tags:
        - Asistente
      operationId: consultarPropuesta
      summary: Consulta una propuesta de pago del chat
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la propuesta
          schema:
            type: string
      responses:
        "200":
          description: Propuesta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Propuesta"
        "404": *a3
  /api/propuestas/{id}/aprobacion:
    post:
      tags:
        - Asistente
      operationId: aprobarPropuesta
      summary: "Aprobación humana: registra el pago propuesto"
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la propuesta
          schema:
            type: string
        - *a6
      responses:
        "201":
          description: Pago registrado.
          content:
            application/json:
              schema:
                type: object
        "404": *a3
        "409": *a7
  /api/propuestas/{id}/rechazo:
    post:
      tags:
        - Asistente
      operationId: rechazarPropuesta
      summary: Rechaza una propuesta de pago
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la propuesta
          schema:
            type: string
        - *a6
      responses:
        "200":
          description: Propuesta rechazada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Propuesta"
        "404": *a3
components:
  schemas:
    Canal:
      type: string
      enum:
        - agencia
        - campo
        - transferencia
      description: Canal de recepción del pago
    Dinero:
      type: object
      properties:
        valor:
          type: string
          pattern: ^\d{1,13}\.\d{2}$
          description: Importe no negativo con exactamente dos decimales
          examples:
            - "1004.62"
        moneda:
          type: string
          const: GTQ
      required:
        - valor
        - moneda
      additionalProperties: false
      description: Importe en quetzales expresado como texto para evitar punto flotante
    EstadoCredito:
      type: string
      enum:
        - VIGENTE
        - EN_MORA
        - REESTRUCTURADO
        - INCOBRABLE
        - CANCELADO
      description: Estado operativo del crédito
    TramoMora:
      type: string
      enum:
        - AL_DIA
        - MORA_1
        - MORA_2
        - MORA_3
        - VENCIDO
        - INCOBRABLE
      description: Clasificación derivada de los días de atraso
    TramoRiesgo:
      type: string
      enum:
        - MORA_1
        - MORA_2
        - MORA_3
        - VENCIDO
        - REESTRUCTURADO_AL_DIA
      description: Tramo que compone la cartera en riesgo
    EstadoSolicitud:
      type: string
      enum:
