openapi: 3.0.3
info:
  title: SGMC - API de Credito Vecino, S. A.
  version: 1.0.0
  description: Contrato generado desde esquemas Zod. El contrato y la validacion
    comparten una unica fuente de verdad.
servers:
  - url: https://api.creditovecino.gt/v1
    description: Produccion ficticia
tags:
  - name: Cartera y cobros
    description: Registro de pagos y saldos
  - name: Cierres e indicadores
    description: Cartera en riesgo y cierres
  - name: Clientes y originacion
    description: Clientes, solicitudes y desembolsos
paths:
  /clientes:
    post:
      tags:
        - Clientes y originacion
      operationId: registrarCliente
      summary: Registra un cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarClienteRequest"
            example:
              nombre: Ana Lopez
              identificacion: DPI-1234567890101
      responses:
        "201":
          description: Cliente registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
              example:
                id: CLI-001
                nombre: Ana Lopez
                identificacion: DPI-1234567890101
        "400":
          description: Revise los datos enviados para registrar el cliente.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/400
                title: Datos de cliente invalidos
                status: 400
                detail: Revise los datos enviados para registrar el cliente.
                instance: /v1/clientes
                traceId: tr-20260822-000731
        "409":
          description: La identificacion ya esta registrada.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/409
                title: Cliente duplicado
                status: 409
                detail: La identificacion ya esta registrada.
                instance: /v1/clientes
                traceId: tr-20260822-000731
  /solicitudes-credito:
    post:
      tags:
        - Clientes y originacion
      operationId: solicitarCredito
      summary: Registra una solicitud de credito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitarCreditoRequest"
            example:
              clienteId: CLI-001
              montoSolicitado:
                valor: "10000.00"
                moneda: GTQ
              numeroCuotas: 12
      responses:
        "201":
          description: Solicitud de credito registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolicitudCreditoResponse"
              example:
                id: SOL-001
                clienteId: CLI-001
                montoSolicitado:
                  valor: "10000.00"
                  moneda: GTQ
                numeroCuotas: 12
                estado: solicitada
                solicitadaEn: 2026-08-27
        "400":
          description: Revise los datos enviados para solicitar el credito.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/400
                title: Solicitud invalida
                status: 400
                detail: Revise los datos enviados para solicitar el credito.
                instance: /v1/solicitudes-credito
                traceId: tr-20260822-000731
        "404":
          description: No existe un cliente con el identificador CLI-001.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/404
                title: Cliente no encontrado
                status: 404
                detail: No existe un cliente con el identificador CLI-001.
                instance: /v1/solicitudes-credito
                traceId: tr-20260822-000731
  /creditos/{creditoId}/desembolso:
    post:
      tags:
        - Clientes y originacion
      operationId: desembolsarCredito
      summary: Desembolsa un credito aprobado
      parameters:
        - name: creditoId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CreditoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesembolsarCreditoRequest"
            example:
              solicitudId: SOL-001
              clienteId: CLI-001
              capital:
                valor: "10000.00"
                moneda: GTQ
              fechaDesembolso: 2026-08-27
      responses:
        "201":
          description: Credito desembolsado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditoResponse"
              example:
                id: C-004
                solicitudId: SOL-001
                clienteId: CLI-001
                capital:
                  valor: "10000.00"
                  moneda: GTQ
                estado: vigente
                diasAtraso: 0
                desembolsadoEn: 2026-08-27
        "404":
          description: No existe la solicitud SOL-001.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/404
                title: Solicitud no encontrada
                status: 404
                detail: No existe la solicitud SOL-001.
                instance: /v1/creditos/C-004/desembolso
                traceId: tr-20260822-000731
        "422":
          description: La solicitud no esta aprobada.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/422
                title: Credito no puede desembolsarse
                status: 422
                detail: La solicitud no esta aprobada.
                instance: /v1/creditos/C-004/desembolso
                traceId: tr-20260822-000731
  /cierres:
    post:
      tags:
        - Cierres e indicadores
      operationId: generarCierre
      summary: Genera un cierre diario o mensual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerarCierreRequest"
            example:
              periodo: 2026-08
              fechaCorte: 2026-08-22
      responses:
        "200":
          description: Cierre mensual existente reproducido sin duplicarlo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CierreResponse"
              example:
                periodo: 2026-08
                fechaCorte: 2026-08-22
                carteraActiva:
                  valor: "800000.00"
                  moneda: GTQ
                saldoEnRiesgo:
                  valor: "56000.00"
                  moneda: GTQ
                incobrable:
                  valor: "15000.00"
                  moneda: GTQ
        "201":
          description: Cierre mensual generado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CierreResponse"
              example:
                periodo: 2026-08
                fechaCorte: 2026-08-22
                carteraActiva:
                  valor: "800000.00"
                  moneda: GTQ
                saldoEnRiesgo:
                  valor: "56000.00"
                  moneda: GTQ
                incobrable:
                  valor: "15000.00"
                  moneda: GTQ
        "400":
          description: Revise el periodo y la fecha de corte.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/400
                title: Parametros de cierre invalidos
                status: 400
                detail: Revise el periodo y la fecha de corte.
                instance: /v1/cierres
                traceId: tr-20260822-000731
  /creditos/{creditoId}/pagos:
    post:
      tags:
        - Cartera y cobros
      operationId: registrarPago
      summary: Registra un pago sobre un credito
      description: Aplica gastos, interes moratorio, interes corriente y capital, en
        ese orden. La fecha del pago la envia el cliente.
      parameters:
        - name: creditoId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CreditoId"
        - name: Idempotency-Key
          in: header
          required: true
          description: Si se repite con el mismo cuerpo, devuelve la respuesta original
            sin cobrar de nuevo.
          schema:
            $ref: "#/components/schemas/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarPagoRequest"
            examples:
              pagoExacto:
                summary: Pago exacto de la cuota 2
                value:
                  monto:
                    valor: "1011.88"
                    moneda: GTQ
                  fechaPago: 2026-08-22
                  medio: agente_bancario
                  referencia: BOL-88213
              pagoParcial:
                summary: Pago parcial
                value:
                  monto:
                    valor: "500.00"
                    moneda: GTQ
                  fechaPago: 2026-08-22
                  medio: efectivo
      responses:
        "200":
          description: Respuesta original de un pago ya registrado; no se cobra nuevamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoRegistrado"
              examples:
                reproducido:
                  value:
                    pagoId: PG-2026-000731
                    creditoId: C-004
                    recibidoEn: 2026-08-22T09:15:00-06:00
                    montoRecibido: &a1
                      valor: "1011.88"
                      moneda: GTQ
                    aplicacion: &a2
                      gastos:
                        valor: "0.00"
                        moneda: GTQ
                      interesMoratorio:
                        valor: "7.26"
                        moneda: GTQ
                      interesCorriente:
                        valor: "278.86"
                        moneda: GTQ
                      capital:
                        valor: "725.76"
                        moneda: GTQ
                      excedente:
                        valor: "0.00"
                        moneda: GTQ
                    destinoExcedente: null
                    saldoCapitalDespues: &a3
                      valor: "8569.62"
                      moneda: GTQ
                    estadoCredito: vigente
                    tramoMora: ninguno
                    diasAtraso: 0
                    reproducido: true
        "201":
          description: Pago registrado por primera vez.
          headers:
            Location:
              schema:
                type: string
              description: URI del pago creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoRegistrado"
              examples:
                nuevo:
                  value:
                    pagoId: PG-2026-000731
                    creditoId: C-004
                    recibidoEn: 2026-08-22T09:15:00-06:00
                    montoRecibido: *a1
                    aplicacion: *a2
                    destinoExcedente: null
                    saldoCapitalDespues: *a3
                    estadoCredito: vigente
                    tramoMora: ninguno
                    diasAtraso: 0
                    reproducido: false
        "404":
          description: No existe un credito con el identificador C-004.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/404
                title: Credito no encontrado
                status: 404
                detail: No existe un credito con el identificador C-004.
                instance: /v1/creditos/C-004/pagos
                traceId: tr-20260822-000731
        "409":
          description: La clave de idempotencia fue reutilizada con otro contenido.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/409
                title: Conflicto de idempotencia
                status: 409
                detail: La clave de idempotencia fue reutilizada con otro contenido.
                instance: /v1/creditos/C-004/pagos
                traceId: tr-20260822-000731
        "422":
          description: El credito no admite pagos en su estado actual.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/422
                title: Credito no admite pagos
                status: 422
                detail: El credito no admite pagos en su estado actual.
                instance: /v1/creditos/C-004/pagos
                traceId: tr-20260822-000731
        "429":
          description: Se excedio el limite de solicitudes. Intente nuevamente mas tarde.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/429
                title: Limite de solicitudes excedido
                status: 429
                detail: Se excedio el limite de solicitudes. Intente nuevamente mas tarde.
                instance: /v1/creditos/C-004/pagos
                traceId: tr-20260822-000731
        "500":
          description: Ocurrio un error no previsto al procesar la solicitud.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/500
                title: Error interno del servidor
                status: 500
                detail: Ocurrio un error no previsto al procesar la solicitud.
                instance: /v1/creditos/C-004/pagos
                traceId: tr-20260822-000731
  /cartera-riesgo:
    get:
      tags:
        - Cierres e indicadores
      operationId: consultarCarteraEnRiesgo
      summary: Consulta cartera en riesgo a una fecha de corte
      description: La fecha de corte es obligatoria y los reestructurados siempre se
        incluyen en el indicador oficial.
      parameters:
        - name: fechaCorte
          in: query
          required: true
          schema:
            type: string
            format: date
            example: 2026-08-22
        - name: incluirReestructurados
          in: query
          required: false
          schema:
            type: boolean
            enum:
              - true
            default: true
      responses:
        "200":
          description: Indicador calculado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarteraEnRiesgoResponse"
              examples:
                referencia:
                  value:
                    fechaCorte: 2026-08-22
                    carteraActiva:
                      valor: "800000.00"
                      moneda: GTQ
                    saldoEnRiesgo:
                      valor: "56000.00"
                      moneda: GTQ
                    porcentajeEnRiesgo: 0.07
                    dadoPorIncobrableEnElPeriodo:
                      valor: "15000.00"
                      moneda: GTQ
                    porTramo: []
                    reestructuradosAlDia:
                      creditos: 1
                      saldoCapital:
                        valor: "6000.00"
                        moneda: GTQ
        "400":
          description: Revise los parametros enviados en la consulta.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/400
                title: Parametros de consulta invalidos
                status: 400
                detail: Revise los parametros enviados en la consulta.
                instance: /v1/cartera-riesgo?fechaCorte=2026-08-22
                traceId: tr-20260822-000731
                errores:
                  - campo: fechaCorte
                    mensaje: El campo es obligatorio y debe tener formato AAAA-MM-DD.
        "422":
          description: La fecha de corte esta fuera del rango permitido.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.creditovecino.gt/problems/422
                title: Fecha de corte fuera de rango
                status: 422
                detail: La fecha de corte esta fuera del rango permitido.
                instance: /v1/cartera-riesgo?fechaCorte=2026-08-22
                traceId: tr-20260822-000731
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        errores:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string
            required:
              - campo
              - mensaje
            additionalProperties: false
      required:
        - type
        - title
        - status
      additionalProperties: false
      description: Cuerpo uniforme de error conforme a RFC 9457
    CreditoId:
      type: string
      pattern: ^C-\d{3,8}$
      description: Identificador del crédito
    IdempotencyKey:
      type: string
      format: uuid
      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      description: Clave UUID para evitar registrar dos veces el mismo pago
    RegistrarClienteRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        identificacion:
          type: string
          minLength: 1
          maxLength: 30
      required:
        - nombre
        - identificacion
      additionalProperties: false
      description: Datos para registrar un cliente
    ClienteResponse:
      type: object
      properties:
        id:
          type: string
          pattern: ^CLI-\d{3,8}$
          description: Identificador del cliente
        nombre:
          type: string
        identificacion:
          type: string
      required:
        - id
        - nombre
        - identificacion
      additionalProperties: false
      description: Cliente registrado en el sistema
    GenerarCierreRequest:
      type: object
      properties:
        periodo:
          anyOf:
            - type: string
              format: date
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            - type: string
              pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: Periodo del cierre diario (AAAA-MM-DD) o mensual (AAAA-MM)
        fechaCorte:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          description: Fecha calendario en formato AAAA-MM-DD
      required:
        - periodo
        - fechaCorte
      additionalProperties: false
      description: Datos para generar un cierre diario o mensual
    CierreResponse:
      type: object
      properties:
        periodo:
          anyOf:
            - type: string
              format: date
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            - type: string
              pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: Periodo del cierre diario (AAAA-MM-DD) o mensual (AAAA-MM)
        fechaCorte:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          description: Fecha calendario en formato AAAA-MM-DD
        carteraActiva:
          type: object
          properties:
            valor:
              type: string
              pattern: ^\d{1,13}\.\d{2}$
              description: Importe no negativo con exactamente dos decimales
            moneda:
              type: string
              enum:
                - GTQ
          required:
            - valor
            - moneda
          additionalProperties: false
          description: Importe en quetzales expresado como texto para evitar punto flotante
        saldoEnRiesgo:
          type: object
          properties:
            valor:
              type: string
              pattern: ^\d{1,13}\.\d{2}$
              description: Importe no negativo con exactamente dos decimales
            moneda:
              type: string
              enum:
                - GTQ
          required:
            - valor
            - moneda
          additionalProperties: false
          description: Importe en quetzales expresado como texto para evitar punto flotante
        incobrable:
          type: object
          properties:
            valor:
              type: string
              pattern: ^\d{1,13}\.\d{2}$
              description: Importe no negativo con exactamente dos decimales
            moneda:
              type: string
              enum:
                - GTQ
          required:
            - valor
            - moneda
          additionalProperties: false
          description: Importe en quetzales expresado como texto para evitar punto flotante
      required:
        - periodo
        - fechaCorte
        - carteraActiva
        - saldoEnRiesgo
        - incobrable
      additionalProperties: false
      description: Cierre diario o mensual de cartera
    DesembolsarCreditoRequest:
      type: object
      properties:
        solicitudId:
          type: string
          pattern: ^SOL-\d{3,8}$
          description: Identificador de la solicitud de credito
        clienteId:
          type: string
          pattern: ^CLI-\d{3,8}$
          description: Identificador del cliente
        capital:
          type: object
          properties:
            valor:
              type: string
              pattern: ^\d{1,13}\.\d{2}$
              description: Importe mayor que cero con exactamente dos decimales
            moneda:
              type: string
              enum:
                - GTQ
          required:
            - valor
            - moneda
          additionalProperties: false
          description: Importe positivo en quetzales expresado como texto
        fechaDesembolso:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          description: Fecha calendario en formato AAAA-MM-DD
      required:
        - solicitudId
        - clienteId
        - capital
        - fechaDesembolso
      additionalProperties: false
      description: Datos para desembolsar un credito aprobado
    CreditoResponse:
      type: object
      properties:
        id:
          type: string
          pattern: ^C-\d{3,8}$
          description: Identificador del credito
        solicitudId:
          type: string
          pattern: ^SOL-\d{3,8}$
          description: Identificador de la solicitud de credito
        clienteId:
          type: string
          pattern: ^CLI-\d{3,8}$
          description: Identificador del cliente
        capital:
          type: object
          properties:
            valor:
              type: string
              pattern: ^\d{1,13}\.\d{2}$
              description: Importe mayor que cero con exactamente dos decimales
            moneda:
              type: string
              enum:
                - GTQ
          required:
            - valor
            - moneda
          additionalProperties: false
          description: Importe positivo en quetzales expresado como texto
        estado:
          type: string
          enum:
            - aprobado
            - desembolsado
            - vigente
            - en_mora
            - reestructurado
            - cancelado
            - incobrable
          description: Estado operativo del credito
        diasAtraso:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        desembolsadoEn:
          type: string
          format: date
