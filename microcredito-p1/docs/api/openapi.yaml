              - titulo
              - vigencia
        alertasSeguridad:
          type: array
          items:
            type: string
        control:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
      required:
        - sesionId
        - respuesta
        - tarjetas
        - propuestas
        - citas
        - alertasSeguridad
        - control
      description: Respuesta del asistente gerencial con tarjetas de datos y citas
    Propuesta:
      type: object
      properties:
        id:
          type: string
        idCredito:
          type: string
        monto:
          $ref: "#/components/schemas/Dinero"
        fechaPago:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Fecha calendario AAAA-MM-DD
          examples:
            - 2026-10-31
        canal:
          $ref: "#/components/schemas/Canal"
        cuota:
          $ref: "#/components/schemas/CuotaExigible"
        aplicacion:
          type: object
          properties:
            aplicado:
              $ref: "#/components/schemas/Adeudo"
            remanente:
              $ref: "#/components/schemas/Dinero"
            cuotaSaldada:
              type: boolean
          required:
            - aplicado
            - remanente
            - cuotaSaldada
          additionalProperties: false
        saldoCapitalResultante:
          $ref: "#/components/schemas/Dinero"
        estado:
          type: string
          enum:
            - PENDIENTE
            - APROBADA
            - RECHAZADA
            - EJECUTADA
        aprobadoPor:
          type: string
      required:
        - id
        - idCredito
        - monto
        - fechaPago
        - canal
        - cuota
        - aplicacion
        - saldoCapitalResultante
        - estado
      additionalProperties: false
      description: Propuesta de pago del chat pendiente de aprobación humana
